<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fort Mill Clubs Directory</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            navy: '#102b4a',
                            blue: '#1d4f7a',
                            gold: '#d7a74a',
                            goldsoft: '#f3dfb3',
                            sand: '#f5efe6',
                            cream: '#fffaf3',
                            mist: '#edf4ff',
                            text: '#1b2d40',
                            muted: '#5a6d82'
                        }
                    },
                    boxShadow: {
                        warm: '0 18px 45px rgba(16, 43, 74, 0.12)'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-brand-sand text-brand-text min-h-screen antialiased">

    <!-- Header Section -->
    <header class="max-w-6xl mx-auto px-4 py-12">
        <div class="rounded-[32px] bg-gradient-to-br from-brand-navy via-[#183f6a] to-[#255f92] px-6 py-12 shadow-warm text-center">
            <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight text-white mb-4">
                Fort Mill <span class="text-brand-goldsoft">Clubs Hub</span>
            </h1>
            <p class="text-[#dfeaf8] text-lg max-w-2xl mx-auto mb-8 leading-relaxed">
                Find your people, discover what’s happening, and get plugged into the community you want to be part of.
            </p>

            <!-- Search Bar -->
            <div class="max-w-md mx-auto relative">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-brand-muted"></i>
                <input 
                    type="text" 
                    id="searchBar" 
                    placeholder="Search clubs by name or category..." 
                    class="w-full pl-12 pr-4 py-3 bg-white/95 border border-[#d8dfe8] rounded-xl focus:outline-none focus:border-brand-gold text-brand-text placeholder-brand-muted shadow-md transition"
                >
            </div>
        </div>
    </header>

    <!-- Main Content Grid -->
    <main class="max-w-6xl mx-auto px-4 pb-20">
        <div id="clubGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Club cards will be dynamically injected here via JavaScript -->
        </div>

        <!-- No Results Message (Hidden by default) -->
        <div id="noResults" class="hidden text-center py-12 text-brand-muted">
            <i class="fa-regular fa-face-frown text-4xl mb-2"></i>
            <p class="text-lg">No clubs found matching your search.</p>
        </div>
    </main>

    <!-- JavaScript to Load JSON and Handle Search -->
    <script>
        let allClubs = [];

        async function loadClubs() {
            try {
                const response = await fetch('clubs.json');
                allClubs = await response.json();
                displayClubs(allClubs);
            } catch (error) {
                console.error("Error loading clubs.json:", error);
                document.getElementById('clubGrid').innerHTML = `
                    <div class="col-span-full text-center text-red-600 bg-red-50 p-6 rounded-2xl border border-red-200 shadow-sm">
                        <p>Could not load clubs data. Make sure 'clubs.json' is in the same folder!</p>
                    </div>
                `;
            }
        }

        function displayClubs(clubs) {
            const grid = document.getElementById('clubGrid');
            const noResults = document.getElementById('noResults');
            grid.innerHTML = '';

            if (clubs.length === 0) {
                noResults.classList.remove('hidden');
                return;
            } else {
                noResults.classList.add('hidden');
            }

            clubs.forEach(club => {
                // Build links dynamically based on what's provided in JSON
                let linksHtml = '';
                if (club.links) {
                    if (club.links.instagram) {
                        linksHtml += `<a href="${club.links.instagram}" target="_blank" class="flex-1 bg-brand-mist hover:bg-brand-gold text-brand-navy border border-[#b9cfe8] hover:border-brand-gold hover:text-brand-navy py-2 px-3 rounded-xl text-center text-sm font-semibold transition">Instagram</a>`;
                    }
                    if (club.links.discord) {
                        linksHtml += `<a href="${club.links.discord}" target="_blank" class="flex-1 bg-brand-cream hover:bg-brand-gold text-brand-navy border border-[#e4d1a2] hover:border-brand-gold hover:text-brand-navy py-2 px-3 rounded-xl text-center text-sm font-semibold transition">Discord</a>`;
                    }
                    if (club.links.form) {
                        linksHtml += `<a href="${club.links.form}" target="_blank" class="flex-1 bg-[#edf7ef] hover:bg-brand-gold text-[#204f42] border border-[#c6dccb] hover:border-brand-gold hover:text-brand-navy py-2 px-3 rounded-xl text-center text-sm font-semibold transition">Join</a>`;
                    }
                }

                const card = document.createElement('div');
                card.className = 'bg-white/90 border border-[#e7d8b1] rounded-2xl p-6 flex flex-col justify-between shadow-warm hover:-translate-y-0.5 transition duration-200';
                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start gap-2 mb-3">
                            <h3 class="text-xl font-bold text-brand-navy">${club.name}</h3>
                            <span class="bg-brand-goldsoft text-brand-navy text-xs font-bold px-2.5 py-1 rounded-full border border-brand-gold/60">${club.category}</span>
                        </div>
                        <p class="text-brand-muted text-sm mb-4 leading-relaxed">${club.description}</p>
                        <div class="text-xs text-brand-navy bg-brand-mist p-3 rounded-xl border border-[#d4e0f0] mb-6 flex items-center gap-2">
                            <i class="fa-regular fa-clock text-brand-blue text-sm"></i>
                            <span>${club.meetingTime}</span>
                        </div>
                    </div>
                    <div class="flex gap-2 flex-wrap">
                        ${linksHtml}
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Search Filter Logic
        document.getElementById('searchBar').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = allClubs.filter(club => 
                club.name.toLowerCase().includes(query) || 
                club.category.toLowerCase().includes(query) ||
                club.description.toLowerCase().includes(query)
            );
            displayClubs(filtered);
        });

        // Load data on page start
        loadClubs();
    </script>
</body>
</html>
