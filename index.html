<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fort Mill Clubs Directory</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

    <!-- Header Section -->
    <header class="max-w-6xl mx-auto px-4 py-12 text-center">
        <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight text-white mb-4">
            Fort Mill <span class="text-indigo-400">Clubs Hub</span>
        </h1>
        <p class="text-slate-400 text-lg max-w-xl mx-auto mb-8">
            Find your community. Explore meeting times, social links, and ways to get involved.
        </p>

        <!-- Search Bar -->
        <div class="max-w-md mx-auto relative">
            <i class="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-slate-400"></i>
            <input 
                type="text" 
                id="searchBar" 
                placeholder="Search clubs by name or category..." 
                class="w-full pl-12 pr-4 py-3 bg-slate-800 border border-slate-700 rounded-xl focus:outline-none focus:border-indigo-500 text-white placeholder-slate-400 shadow-lg transition"
            >
        </div>
    </header>

    <!-- Main Content Grid -->
    <main class="max-w-6xl mx-auto px-4 pb-20">
        <div id="clubGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Club cards will be dynamically injected here via JavaScript -->
        </div>

        <!-- No Results Message (Hidden by default) -->
        <div id="noResults" class="hidden text-center py-12 text-slate-400">
            <i class="fa-regular fa-face-frown text-4xl mb-2"></i>
            <p>No clubs found matching your search.</p>
        </div>
    </main>

    <!-- JavaScript to Load JSON and Handle Search -->
    <script>
        let allClubs = [];

        async function loadClubs() {
            try {
                const response = await fetch('clubs.json');
                allClubs = await response.json();
                displayClubs(allClubs);
            } catch (error) {
                console.error("Error loading clubs.json:", error);
                document.getElementById('clubGrid').innerHTML = `
                    <div class="col-span-full text-center text-red-400 bg-red-950/30 p-6 rounded-xl border border-red-900">
                        <p>Could not load clubs data. Make sure 'clubs.json' is in the same folder!</p>
                    </div>
                `;
            }
        }

        function displayClubs(clubs) {
            const grid = document.getElementById('clubGrid');
            const noResults = document.getElementById('noResults');
            grid.innerHTML = '';

            if (clubs.length === 0) {
                noResults.classList.remove('hidden');
                return;
            } else {
                noResults.classList.add('hidden');
            }

            clubs.forEach(club => {
                // Build links dynamically based on what's provided in JSON
                let linksHtml = '';
                if (club.links) {
                    if (club.links.instagram) {
                        linksHtml += `<a href="${club.links.instagram}" target="_blank" class="flex-1 bg-slate-800 hover:bg-pink-600/20 hover:border-pink-500 border border-slate-700 py-2 px-3 rounded-lg text-center text-sm font-medium transition flex items-center justify-center gap-2"><i class="fa-brands fa-instagram text-pink-400"></i> Insta</a>`;
                    }
                    if (club.links.discord) {
                        linksHtml += `<a href="${club.links.discord}" target="_blank" class="flex-1 bg-slate-800 hover:bg-indigo-600/20 hover:border-indigo-500 border border-slate-700 py-2 px-3 rounded-lg text-center text-sm font-medium transition flex items-center justify-center gap-2"><i class="fa-brands fa-discord text-indigo-400"></i> Discord</a>`;
                    }
                    if (club.links.form) {
                        linksHtml += `<a href="${club.links.form}" target="_blank" class="flex-1 bg-slate-800 hover:bg-emerald-600/20 hover:border-emerald-500 border border-slate-700 py-2 px-3 rounded-lg text-center text-sm font-medium transition flex items-center justify-center gap-2"><i class="fa-solid fa-file-lines text-emerald-400"></i> Sign Up</a>`;
                    }
                }

                const card = document.createElement('div');
                card.className = "bg-slate-800/60 border border-slate-700/80 rounded-2xl p-6 flex flex-col justify-between backdrop-blur-sm shadow-xl hover:border-slate-600 transition";
                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start gap-2 mb-3">
                            <h3 class="text-xl font-bold text-white">${club.name}</h3>
                            <span class="bg-indigo-500/10 text-indigo-400 text-xs font-semibold px-2.5 py-1 rounded-full border border-indigo-500/20">${club.category}</span>
                        </div>
                        <p class="text-slate-300 text-sm mb-4 leading-relaxed">${club.description}</p>
                        <div class="text-xs text-slate-400 bg-slate-900/50 p-3 rounded-xl border border-slate-800 mb-6 flex items-center gap-2">
                            <i class="fa-regular fa-clock text-indigo-400 text-sm"></i>
                            <span>${club.meetingTime}</span>
                        </div>
                    </div>
                    <div class="flex gap-2 flex-wrap">
                        ${linksHtml}
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Search Filter Logic
        document.getElementById('searchBar').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = allClubs.filter(club => 
                club.name.toLowerCase().includes(query) || 
                club.category.toLowerCase().includes(query) ||
                club.description.toLowerCase().includes(query)
            );
            displayClubs(filtered);
        });

        // Load data on page start
        loadClubs();
    </script>
</body>
</html>
